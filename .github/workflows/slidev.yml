name: Slidev addon

on:
  push:
    paths:
      - 'packages/slidev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/slidev.yml'
  pull_request:
    paths:
      - 'packages/slidev/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/slidev.yml'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Exact published @figuro/slidev version (leave empty to test the checkout tarball)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported release and newest release within the declared peer range.
        slidev: ['53.0.0', '53']
    env:
      SLIDEV_VERSION: ${{ matrix.slidev }}
      FIGURO_PACKAGE_VERSION: ${{ inputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Typecheck, inspect the package, and run browser acceptance
        run: pnpm --filter @figuro/slidev test:docker
